FACEBOOK_MOCK = "true"
FACEBOOK_SOURCES = "[{\"name\":\"NORECO II\",\"page_id\":\"NORECO2Official\",\"enabled\":true},{\"name\":\"NGCP\",\"page_id\":\"NGCPph\",\"enabled\":true}]"
FACEBOOK_POLL_INTERVAL_MINUTES = "1"
